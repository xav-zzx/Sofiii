<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>¿Quieres salir conmigo?</title>

<!--
  ============================================================
  CÓMO PERSONALIZAR ESTA PÁGINA
  ============================================================
  1) LA PREGUNTA: busca más abajo
         const PREGUNTA = "..."

  2) EL MENSAJE FINAL (cuando toca "Sí"): busca
         const MENSAJE_FINAL = "..."

  3) LAS FRASES QUE APARECEN CADA VEZ QUE EL "NO" HUYE: busca
         const FRASES_HUIDA = [...]
     puedes agregar, quitar o cambiar las que quieras.

  Todo lo demás ya está listo, no hace falta tocar nada más.
  Solo abre este archivo con doble clic.
  ============================================================
-->

<style>
  :root{
    --cielo-1:#ffd6e6;
    --cielo-2:#d6c2f0;
    --cielo-3:#a9c0ec;
    --nube:#fdfaff;
    --nube-sombra:#c9b8e6;
    --dorado:#f0b94d;
    --tarjeta:#fffaf3;
    --texto:#4a3b52;
    --texto-suave:#8a7793;
    --si-1:#ff8fab;
    --si-2:#ff6b9d;
    --no-fondo:#f1e6f6;
    --no-texto:#8a7093;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;
  }

  .cielo{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, var(--cielo-1) 0%, var(--cielo-2) 55%, var(--cielo-3) 100%);
    padding:6vw;
  }

  /* ---------- estrellas ---------- */
  .estrella{
    position:absolute;
    color:var(--dorado);
    opacity:.7;
    animation:parpadeo 3s ease-in-out infinite;
    pointer-events:none;
    user-select:none;
  }
  @keyframes parpadeo{
    0%,100%{ opacity:.35; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.3); }
  }

  /* ---------- nubes ---------- */
  .nube{
    position:absolute;
    bottom:0;
    width:220px;
    height:90px;
    pointer-events:none;
  }
  .nube svg{ width:100%; height:100%; display:block; }
  .nube.a{ left:-4%; animation:flotarNube 26s ease-in-out infinite; }
  .nube.b{ right:-6%; width:280px; height:110px; animation:flotarNube 32s ease-in-out infinite reverse; }
  .nube.c{ left:38%; width:180px; height:70px; opacity:.85; animation:flotarNube 22s ease-in-out infinite 2s; }
  @keyframes flotarNube{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(24px); }
  }

  /* ---------- tarjeta ---------- */
  .tarjeta{
    position:relative;
    width:min(90vw, 380px);
    background:var(--tarjeta);
    border-radius:22px;
    box-shadow:0 24px 60px rgba(90,60,110,.35);
    padding:2.1rem 1.6rem 1.8rem;
    text-align:center;
    opacity:0;
    animation:aparecer 1.1s ease-out .1s forwards;
  }

  .puntos{
    position:absolute;
    top:16px;
    left:18px;
    display:flex;
    gap:6px;
  }
  .puntos span{
    width:9px; height:9px; border-radius:50%;
  }
  .puntos span:nth-child(1){ background:#ffb199; }
  .puntos span:nth-child(2){ background:#ffd98f; }
  .puntos span:nth-child(3){ background:#a8e0b0; }

  .pregunta{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.5rem, 6.5vw, 1.9rem);
    color:var(--texto);
    margin:1.6rem 0 .3rem;
    line-height:1.25;
  }

  .subtexto{
    min-height:1.4rem;
    font-size:.85rem;
    color:var(--texto-suave);
    margin:0 0 1.4rem;
    transition:opacity .2s ease;
  }

  .zona-botones{
    position:relative;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1rem;
  }

  .btn{
    border:none;
    border-radius:14px;
    padding:.85rem 1.7rem;
    font-family:'Inter',sans-serif;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .btn-si{
    background:linear-gradient(135deg, var(--si-1), var(--si-2));
    color:#fff;
    box-shadow:0 10px 24px rgba(255,107,157,.4);
    transition:transform .25s cubic-bezier(.3,1.4,.4,1);
  }

  .btn-no{
    position:relative;
    background:var(--no-fondo);
    color:var(--no-texto);
    transition:top .28s ease, left .28s ease, transform .15s ease;
  }
  .zona-botones.activa .btn-no{
    position:absolute;
  }

  @keyframes aparecer{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- overlay final ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(60,40,70,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    padding:6vw;
  }
  .overlay.mostrar{ opacity:1; pointer-events:auto; }

  .tarjeta-final{
    background:var(--tarjeta);
    border-radius:22px;
    padding:2.4rem 1.8rem;
    text-align:center;
    max-width:340px;
    box-shadow:0 24px 60px rgba(90,60,110,.4);
    transform:scale(.85);
    transition:transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.mostrar .tarjeta-final{ transform:scale(1); }

  .tarjeta-final .emoji{
    font-size:2.6rem;
    margin-bottom:.6rem;
    display:block;
  }
  .tarjeta-final p{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic;
    font-weight:600;
    font-size:1.35rem;
    color:var(--texto);
    line-height:1.4;
    margin:0 0 1.4rem;
  }
  .tarjeta-final button{
    border:none;
    border-radius:12px;
    padding:.7rem 1.8rem;
    background:linear-gradient(135deg, var(--si-1), var(--si-2));
    color:#fff;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
  }

  .confeti{
    position:fixed;
    top:-10px;
    font-size:18px;
    pointer-events:none;
    animation:caerConfeti linear forwards;
  }
  @keyframes caerConfeti{
    to{ transform:translateY(110vh) rotate(360deg); opacity:.2; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="cielo" id="cielo">

  <div class="nube a"><svg viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="30" fill="var(--nube)"/><ellipse cx="110" cy="45" rx="45" ry="35" fill="var(--nube)"/><ellipse cx="160" cy="60" rx="50" ry="28" fill="var(--nube)"/><ellipse cx="60" cy="68" rx="55" ry="18" fill="var(--nube-sombra)" opacity=".3"/></svg></div>
  <div class="nube b"><svg viewBox="0 0 280 110" xmlns="http://www.w3.org/2000/svg"><ellipse cx="80" cy="70" rx="65" ry="34" fill="var(--nube)"/><ellipse cx="150" cy="50" rx="55" ry="40" fill="var(--nube)"/><ellipse cx="215" cy="70" rx="58" ry="30" fill="var(--nube)"/></svg></div>
  <div class="nube c"><svg viewBox="0 0 180 70" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="45" rx="40" ry="22" fill="var(--nube)"/><ellipse cx="100" cy="35" rx="36" ry="26" fill="var(--nube)"/><ellipse cx="140" cy="46" rx="34" ry="20" fill="var(--nube)"/></svg></div>

  <div class="tarjeta" id="tarjeta">
    <div class="puntos"><span></span><span></span><span></span></div>

    <h1 class="pregunta" id="preguntaTexto"></h1>
    <p class="subtexto" id="subtexto">tómate tu tiempo...</p>

    <div class="zona-botones" id="zonaBotones">
      <button class="btn btn-si" id="btnSi">Sí</button>
      <button class="btn btn-no" id="btnNo">No</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="tarjeta-final">
    <span class="emoji">🎉</span>
    <p id="mensajeFinalTexto"></p>
    <button id="btnCerrar">Cerrar</button>
  </div>
</div>

<script>
  // ============================================================
  //  PERSONALIZA AQUÍ ↓↓↓
  // ============================================================
  const PREGUNTA = "¿Quieres salir conmigo?";
  const MENSAJE_FINAL = "jaja gracias por la oportunidad, tqm";
  const FRASES_HUIDA = [
    "jaja no seas así 🥲",
    "¿segura? mira bien...",
    "el \"no\" no quiere cooperar",
    "vamos, inténtalo de nuevo",
    "casi, casi... 👀",
    "el botón está nervioso",
    "ya, dale que sí mejor 🙈"
  ];
  // ============================================================

  document.getElementById('preguntaTexto').textContent = PREGUNTA;
  document.getElementById('mensajeFinalTexto').textContent = MENSAJE_FINAL;

  // estrellas de fondo
  const cieloEl = document.getElementById('cielo');
  const simbolosEstrella = ['✦','✨','⭐'];
  for(let i=0;i<18;i++){
    const e = document.createElement('div');
    e.className = 'estrella';
    e.textContent = simbolosEstrella[Math.floor(Math.random()*simbolosEstrella.length)];
    e.style.left = Math.random()*100+'%';
    e.style.top = (Math.random()*55)+'%';
    e.style.fontSize = (10+Math.random()*10)+'px';
    e.style.animationDelay = (Math.random()*3)+'s';
    cieloEl.appendChild(e);
  }

  // ---------- lógica del botón "No" que huye ----------
  const zona = document.getElementById('zonaBotones');
  const btnNoEl = document.getElementById('btnNo');
  const btnSiEl = document.getElementById('btnSi');
  const subtextoEl = document.getElementById('subtexto');
  let intentos = 0;

  function moverNo(){
    const zonaRect = zona.getBoundingClientRect();
    const noRect = btnNoEl.getBoundingClientRect();

    if(!zona.classList.contains('activa')){
      zona.classList.add('activa');
      // fijar posición inicial actual antes de empezar a moverlo
      btnNoEl.style.top = (noRect.top - zonaRect.top) + 'px';
      btnNoEl.style.left = (noRect.left - zonaRect.left) + 'px';
    }

    const maxTop = Math.max(zonaRect.height - noRect.height, 0);
    const maxLeft = Math.max(zonaRect.width - noRect.width, 0);
    const nuevoTop = Math.random() * maxTop;
    const nuevoLeft = Math.random() * maxLeft;

    btnNoEl.style.top = nuevoTop + 'px';
    btnNoEl.style.left = nuevoLeft + 'px';

    intentos++;
    const frase = FRASES_HUIDA[Math.min(intentos - 1, FRASES_HUIDA.length - 1)];
    subtextoEl.textContent = frase;

    // el Sí crece un poco cada vez, hasta un límite
    const escala = Math.min(1 + intentos * 0.07, 1.55);
    btnSiEl.style.transform = 'scale(' + escala + ')';
  }

  btnNoEl.addEventListener('pointerenter', moverNo);
  btnNoEl.addEventListener('touchstart', (ev) => { ev.preventDefault(); moverNo(); }, { passive:false });
  btnNoEl.addEventListener('click', (ev) => { ev.preventDefault(); moverNo(); });

  // ---------- botón "Sí" ----------
  const overlayEl = document.getElementById('overlay');
  const btnCerrarEl = document.getElementById('btnCerrar');

  function lanzarConfeti(){
    const simbolos = ['✨','💛','⭐','✦','🎉'];
    for(let i=0;i<24;i++){
      const c = document.createElement('div');
      c.className = 'confeti';
      c.textContent = simbolos[Math.floor(Math.random()*simbolos.length)];
      c.style.left = Math.random()*100+'vw';
      c.style.animationDuration = (2.2 + Math.random()*1.6)+'s';
      c.style.opacity = .7 + Math.random()*.3;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 4000);
    }
  }

  btnSiEl.addEventListener('click', () => {
    overlayEl.classList.add('mostrar');
    lanzarConfeti();
  });

  btnCerrarEl.addEventListener('click', () => {
    overlayEl.classList.remove('mostrar');
  });
</script>

</body>
</html>
