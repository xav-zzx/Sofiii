<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>

<!--
  ============================================================
  CÓMO PERSONALIZAR ESTA PÁGINA
  ============================================================
  1) EL MENSAJE PRINCIPAL: busca más abajo la línea que dice
         const MENSAJE = "..."
     y cambia el texto entre comillas por tu frase.

  2) LA FIRMA (opcional, debajo del mensaje): busca
         const FIRMA = "..."
     y pon tu nombre o déjalo vacío ("") si no quieres firma.

  3) EL NOMBRE (arriba de la cúpula): busca
         const NOMBRE = "..."

  4) LOS SÍMBOLOS QUE SALEN AL TOCAR LA CÚPULA: busca
         const SIMBOLOS = ['✦', '✨', '⭐', '🌟']
     y cambia los emojis/símbolos por los que quieras.

  Todo lo demás (colores, animación, flores) ya está listo,
  no hace falta tocar nada más. Solo abre este archivo con
  doble clic y se abre en el navegador.
  ============================================================
-->

<style>
  :root{
    --noche-1:#05040c;
    --noche-2:#160f33;
    --noche-3:#241a4d;
    --oro:#d9b26a;
    --oro-suave:#f1d9a3;
    --lirio-blanco:#fdf6f0;
    --lirio-rosa:#f3c8d8;
    --lirio-fucsia:#c8547e;
    --hoja:#4f7a5e;
    --hoja-clara:#6f9c7c;
    --texto-crema:#f6efe2;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--noche-1);
    overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;
  }

  .escena{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at 50% 38%, var(--noche-3) 0%, var(--noche-2) 45%, var(--noche-1) 100%);
    padding:6vh 6vw;
  }

  /* ---------- estrellas de fondo ---------- */
  .estrella{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--oro-suave);
    opacity:.5;
    animation:parpadeo 3.5s ease-in-out infinite;
  }
  @keyframes parpadeo{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.6); }
  }

  /* ---------- encabezado ---------- */
  .encabezado{
    text-align:center;
    margin-bottom:1.2rem;
    opacity:0;
    animation:aparecer 1.4s ease-out .2s forwards;
  }
  .para{
    font-size:.72rem;
    letter-spacing:.28em;
    color:var(--oro-suave);
    opacity:.75;
    margin:0 0 .35rem;
  }
  .nombre{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.6rem, 6vw, 2.4rem);
    color:var(--texto-crema);
    margin:0;
  }

  /* ---------- cúpula ---------- */
  .contenedor-cupula{
    position:relative;
    width:min(78vw, 320px);
    aspect-ratio:3/4;
    opacity:0;
    overflow:hidden;
    animation:aparecer 1.6s ease-out .5s forwards;
  }

  .brillo-ambiente{
    position:absolute;
    inset:-10%;
    background:radial-gradient(circle at 50% 55%, rgba(243,200,216,.35), rgba(200,84,126,.12) 45%, transparent 72%);
    filter:blur(6px);
    animation:respirar 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes respirar{
    0%,100%{ opacity:.6; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.06); }
  }

  svg{ width:100%; height:100%; display:block; overflow:visible; }

  .vidrio{
    fill:rgba(255,255,255,.03);
    stroke:var(--oro);
    stroke-width:1.4;
    opacity:.55;
  }
  .brillo-vidrio{
    stroke:var(--oro-suave);
    stroke-width:1;
    opacity:.35;
    fill:none;
  }
  .base-cupula{
    fill:none;
    stroke:var(--oro);
    stroke-width:2;
    opacity:.7;
  }

  .grupo-tallo{
    transform-origin:160px 300px;
    animation:balanceo 4.5s ease-in-out infinite;
  }
  @keyframes balanceo{
    0%,100%{ transform:rotate(-3.2deg); }
    50%{ transform:rotate(3deg); }
  }

  .tallo{
    fill:none;
    stroke:var(--hoja);
    stroke-width:3.4;
    stroke-linecap:round;
  }
  .hoja{
    fill:var(--hoja);
  }
  .hoja-clara{ fill:var(--hoja-clara); }

  .petalo{
    fill:url(#degradadoPetalo);
    stroke:rgba(255,255,255,.5);
    stroke-width:.4;
  }
  .mota{
    fill:var(--lirio-fucsia);
    opacity:.55;
  }
  .estambre{
    stroke:var(--hoja);
    stroke-width:1.3;
    fill:none;
    stroke-linecap:round;
  }
  .antera{
    fill:#a8622f;
  }

  .flor{
    filter:url(#resplandorFlor);
    transform-origin:center;
    animation:florecer 2.4s cubic-bezier(.2,.9,.3,1) both,
              respirarFlor 3.6s ease-in-out 2.4s infinite,
              girarFlor 9s linear 2.4s infinite;
  }
  .flor.dos{
    animation:florecer 2.4s cubic-bezier(.2,.9,.3,1) .35s both,
              respirarFlor 3.2s ease-in-out 2.75s infinite,
              girarFlor 11s linear 2.75s infinite reverse;
  }
  .flor.capullo{ animation:aparecerCapullo 1.6s ease-out 1s both; }

  @keyframes florecer{
    0%{ transform:scale(.2); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes respirarFlor{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.07); }
  }
  @keyframes girarFlor{
    0%{ filter:url(#resplandorFlor) hue-rotate(0deg); }
    50%{ filter:url(#resplandorFlor) hue-rotate(8deg); }
    100%{ filter:url(#resplandorFlor) hue-rotate(0deg); }
  }
  @keyframes aparecerCapullo{
    0%{ transform:scale(.3); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  .petalo{ transform-origin:0 0; animation:temblorPetalo 3.4s ease-in-out infinite; }
  @keyframes temblorPetalo{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(2.5deg); }
  }

  /* pétalos cayendo dentro de la cúpula */
  .petalo-cayendo{
    position:absolute;
    width:10px;
    height:14px;
    background:linear-gradient(160deg, var(--lirio-blanco), var(--lirio-rosa));
    border-radius:60% 10% 60% 10%;
    opacity:0;
    animation-name:caer;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 0 3px rgba(243,200,216,.6));
  }
  @keyframes caer{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    8%{ opacity:.9; }
    85%{ opacity:.6; }
    100%{ transform:translateY(150px) rotate(200deg); opacity:0; }
  }

  /* ---------- mensaje ---------- */
  .mensaje-envoltura{
    margin-top:1.6rem;
    text-align:center;
    max-width:340px;
    opacity:0;
    animation:aparecer 1.6s ease-out 1.6s forwards;
  }
  .mensaje{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.05rem, 4vw, 1.35rem);
    line-height:1.5;
    color:var(--texto-crema);
    margin:0;
  }
  .firma{
    margin-top:.7rem;
    font-size:.78rem;
    letter-spacing:.14em;
    color:var(--oro-suave);
    opacity:.8;
  }
  .pista{
    margin-top:1.4rem;
    font-size:.68rem;
    letter-spacing:.1em;
    color:var(--texto-crema);
    opacity:.35;
  }

  @keyframes aparecer{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* destellos flotantes al tocar */
  .destello-flotante{
    position:absolute;
    bottom:38%;
    font-size:14px;
    opacity:0;
    animation:flotar 2.4s ease-out forwards;
    pointer-events:none;
  }
  @keyframes flotar{
    0%{ transform:translateY(0) scale(.5) rotate(0deg); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translateY(-170px) scale(1.15) rotate(60deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="escena" id="escena">

  <div class="encabezado">
    <p class="para">para</p>
    <h1 class="nombre" id="nombreDestino"></h1>
  </div>

  <div class="contenedor-cupula" id="cupula">
    <div class="brillo-ambiente"></div>

    <svg viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <radialGradient id="degradadoPetalo" cx="50%" cy="82%" r="90%">
          <stop offset="0%" stop-color="var(--lirio-fucsia)"/>
          <stop offset="42%" stop-color="var(--lirio-rosa)"/>
          <stop offset="100%" stop-color="var(--lirio-blanco)"/>
        </radialGradient>

        <filter id="resplandorFlor" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- una flor de lirio reutilizable -->
        <g id="lirio">
          <!-- 3 pétalos traseros -->
          <g transform="rotate(0)"><path class="petalo" d="M0,0 C-4,-16 -3,-34 0,-46 C3,-34 4,-16 0,0 Z"/></g>
          <g transform="rotate(120)"><path class="petalo" d="M0,0 C-4,-16 -3,-34 0,-46 C3,-34 4,-16 0,0 Z"/></g>
          <g transform="rotate(240)"><path class="petalo" d="M0,0 C-4,-16 -3,-34 0,-46 C3,-34 4,-16 0,0 Z"/></g>
          <!-- 3 pétalos delanteros, alternados -->
          <g transform="rotate(60)"><path class="petalo" d="M0,0 C-5,-18 -4,-38 0,-52 C4,-38 5,-18 0,0 Z"/></g>
          <g transform="rotate(180)"><path class="petalo" d="M0,0 C-5,-18 -4,-38 0,-52 C4,-38 5,-18 0,0 Z"/></g>
          <g transform="rotate(300)"><path class="petalo" d="M0,0 C-5,-18 -4,-38 0,-52 C4,-38 5,-18 0,0 Z"/></g>
          <!-- motas del centro -->
          <circle class="mota" cx="-2" cy="-8" r="1"/>
          <circle class="mota" cx="3" cy="-11" r="1"/>
          <circle class="mota" cx="-3" cy="-14" r=".8"/>
          <circle class="mota" cx="2" cy="-6" r=".7"/>
          <!-- estambres -->
          <g>
            <path class="estambre" d="M0,0 C-8,-10 -14,-16 -18,-22"/>
            <ellipse class="antera" cx="-18" cy="-22" rx="2.6" ry="1.6" transform="rotate(-40 -18 -22)"/>
            <path class="estambre" d="M0,0 C8,-10 14,-16 18,-22"/>
            <ellipse class="antera" cx="18" cy="-22" rx="2.6" ry="1.6" transform="rotate(40 18 -22)"/>
            <path class="estambre" d="M0,0 C-3,-14 -2,-22 0,-30"/>
            <ellipse class="antera" cx="0" cy="-30" rx="2.4" ry="1.5"/>
            <path class="estambre" d="M0,0 C3,-14 2,-22 0,-30"/>
          </g>
        </g>
      </defs>

      <!-- cúpula de cristal -->
      <path class="vidrio" d="M60,300 L60,150 C60,80 100,36 160,36 C220,36 260,80 260,150 L260,300 Z"/>
      <path class="brillo-vidrio" d="M78,290 L78,150 C78,95 110,58 150,50"/>
      <circle class="vidrio" cx="160" cy="24" r="7"/>
      <line class="vidrio" x1="160" y1="18" x2="160" y2="12"/>
      <ellipse class="base-cupula" cx="160" cy="300" rx="100" ry="9"/>

      <!-- tallo, hojas y lirios -->
      <g class="grupo-tallo">
        <path class="tallo" d="M160,295 C158,250 162,210 158,175"/>
        <path class="tallo" d="M158,220 C140,225 122,235 108,252"/>
        <path class="tallo" d="M160,195 C180,198 198,208 210,222"/>

        <path class="hoja" d="M108,252 C122,240 140,236 156,240 C142,254 124,258 108,252 Z"/>
        <path class="hoja-clara" d="M210,222 C196,212 178,210 162,216 C176,228 194,230 210,222 Z"/>

        <use href="#lirio" xlink:href="#lirio" class="flor uno" x="158" y="175"/>
        <use href="#lirio" xlink:href="#lirio" class="flor dos" x="108" y="252" transform="rotate(-18 108 252) scale(.8)"/>
        <g class="flor capullo" transform="translate(210,222) rotate(24) scale(.4)">
          <ellipse cx="0" cy="-14" rx="7" ry="16" fill="url(#degradadoPetalo)"/>
        </g>
      </g>
    </svg>

    <!-- pétalos que caen dentro de la cúpula -->
    <div class="petalo-cayendo" style="left:38%; top:12%; animation-duration:7s; animation-delay:.5s;"></div>
    <div class="petalo-cayendo" style="left:52%; top:8%; animation-duration:9s; animation-delay:2.4s;"></div>
    <div class="petalo-cayendo" style="left:46%; top:18%; animation-duration:8s; animation-delay:4.6s;"></div>
  </div>

  <div class="mensaje-envoltura">
    <p class="mensaje" id="mensajeTexto"></p>
    <p class="firma" id="firmaTexto"></p>
  </div>

  <p class="pista">toca la cúpula ✦</p>
</div>

<script>
  // ============================================================
  //  PERSONALIZA AQUÍ ↓↓↓
  // ============================================================
  const NOMBRE  = "Rizitos ✦ ";
  const MENSAJE = "Sé que la cagué bien feo, y de verdad me arrepiento porque t extraño :) es aburrido sin tí";
  const FIRMA   = "— perdón, y gracias por leer hasta aquí <3";
  // ============================================================

  document.getElementById('nombreDestino').textContent = NOMBRE;
  document.getElementById('mensajeTexto').textContent  = MENSAJE;
  document.getElementById('firmaTexto').textContent    = FIRMA;

  // estrellas de fondo generadas aleatoriamente
  const escenaEl = document.getElementById('escena');
  for(let i=0;i<40;i++){
    const e = document.createElement('div');
    e.className = 'estrella';
    e.style.left = Math.random()*100+'%';
    e.style.top  = Math.random()*70+'%';
    e.style.animationDelay = (Math.random()*3.5)+'s';
    escenaEl.appendChild(e);
  }

  // al tocar la cúpula: suben estrellas y destellos (cambia estos símbolos si quieres otros)
  const SIMBOLOS = ['✦', '✨', '⭐', '🤍'];
  const cupulaEl = document.getElementById('cupula');
  cupulaEl.addEventListener('click', () => {
    for(let i=0;i<7;i++){
      const c = document.createElement('div');
      c.className = 'destello-flotante';
      c.textContent = SIMBOLOS[Math.floor(Math.random()*SIMBOLOS.length)];
      c.style.left = (25+Math.random()*50)+'%';
      c.style.fontSize = (12+Math.random()*8)+'px';
      c.style.animationDelay = (Math.random()*.4)+'s';
      cupulaEl.appendChild(c);
      setTimeout(()=>c.remove(), 2800);
    }
  });
</script>

</body>
</html>
